<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Weblino</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Get a dashboard to track your Weblino project</p>
    <div class="err-msg" id="errMsg"></div>
    <form id="registerForm">
      <div class="field"><label>Full name</label><input id="name" required></div>
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="field"><label>Phone (optional)</label><input id="phone"></div>
      <div class="field"><label>Password</label><input type="password" id="password" required minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Create account</button>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:.88rem;color:var(--gray)">
      Already have an account? <a href="login.html" style="color:var(--accent-2)">Sign in</a>
    </p>
  </div>
</div>
<script src="../js/panel.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('errMsg');
  errBox.style.display = 'none';
  try {
    await api('/auth/register', {
      method: 'POST',
      body: {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
      }
    });
    window.location.href = 'dashboard.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});
</script>
</body>
</html>
